<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Antigravity Member System 會員資料管理系統"
  >

  <title>Antigravity Member System</title>

  <style>

    /* ================================
       CSS:BASE
    ================================= */

    :root {
      --bg-deep: #020617;
      --bg-card: rgba(255, 255, 255, 0.05);
      --border-glass: rgba(255, 255, 255, 0.1);

      --text-main: #f8fafc;
      --text-muted: #94a3b8;

      --neon-green: #39ff88;
      --neon-blue: #22d3ee;
      --neon-purple: #a855f7;
      --neon-yellow: #facc15;
      --danger: #fb7185;

      --radius: 20px;
      --transition: 0.3s ease;
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      min-height: 100vh;

      font-family:
        "Inter",
        "Noto Sans TC",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

      color: var(--text-main);

      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(34, 211, 238, 0.12),
          transparent 28%
        ),
        radial-gradient(
          circle at 85% 15%,
          rgba(168, 85, 247, 0.15),
          transparent 30%
        ),
        radial-gradient(
          circle at 50% 90%,
          rgba(57, 255, 136, 0.08),
          transparent 30%
        ),
        var(--bg-deep);

      overflow-x: hidden;
    }


    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      opacity: 0.35;

      background-image:
        radial-gradient(
          circle,
          rgba(255, 255, 255, .8) 1px,
          transparent 1px
        ),
        radial-gradient(
          circle,
          rgba(34, 211, 238, .5) 1px,
          transparent 1px
        );

      background-size:
        90px 90px,
        150px 150px;

      background-position:
        10px 20px,
        60px 80px;
    }


    button,
    input,
    select {
      font: inherit;
    }


    button {
      cursor: pointer;
    }


    /* ================================
       CSS:LAYOUT
    ================================= */

    .page {
      position: relative;
      z-index: 1;

      width: min(1400px, 92%);

      margin: 0 auto;

      padding: 60px 0;
    }


    .hero {
      text-align: center;

      margin-bottom: 50px;
    }


    .hero-badge {
      display: inline-flex;

      align-items: center;

      gap: 8px;

      padding: 8px 16px;

      margin-bottom: 20px;

      border:
        1px solid
        rgba(34, 211, 238, 0.3);

      border-radius: 999px;

      background:
        rgba(34, 211, 238, 0.06);

      color: var(--neon-blue);

      font-size: 13px;

      letter-spacing: 2px;

      box-shadow:
        0 0 20px
        rgba(34, 211, 238, 0.1);
    }


    .hero h1 {
      font-size:
        clamp(36px, 6vw, 72px);

      line-height: 1.1;

      margin-bottom: 20px;

      background:
        linear-gradient(
          90deg,
          var(--neon-blue),
          var(--neon-green),
          var(--neon-purple)
        );

      -webkit-background-clip: text;

      background-clip: text;

      color: transparent;

      text-shadow:
        0 0 35px
        rgba(34, 211, 238, 0.15);
    }


    .hero p {
      max-width: 680px;

      margin: 0 auto;

      color: var(--text-muted);

      font-size: 17px;

      line-height: 1.8;
    }


    .dashboard {
      display: grid;

      grid-template-columns:
        minmax(300px, 380px)
        1fr;

      gap: 28px;

      align-items: start;
    }


    /* ================================
       CSS:GLASS
    ================================= */

    .glass-card {
      position: relative;

      background: var(--bg-card);

      border:
        1px solid
        var(--border-glass);

      border-radius: var(--radius);

      backdrop-filter: blur(16px);

      -webkit-backdrop-filter: blur(16px);

      box-shadow:
        0 25px 70px
        rgba(0, 0, 0, 0.35),

        inset 0 1px 0
        rgba(255, 255, 255, 0.04);

      transition:
        transform var(--transition),
        border-color var(--transition),
        box-shadow var(--transition);
    }


    .glass-card:hover {
      transform: translateY(-5px);

      border-color:
        rgba(34, 211, 238, 0.25);

      box-shadow:
        0 30px 80px
        rgba(0, 0, 0, 0.45),

        0 0 30px
        rgba(34, 211, 238, 0.08);
    }


    .floating {
      animation:
        float 6s ease-in-out infinite;
    }


    .floating-slow {
      animation:
        float 8s ease-in-out infinite;

      animation-delay: -2s;
    }


    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }


    /* ================================
       CSS:FORM
    ================================= */

    .form-card {
      padding: 28px;
    }


    .card-title {
      margin-bottom: 8px;

      font-size: 22px;

      font-weight: 700;
    }


    .card-description {
      margin-bottom: 25px;

      color: var(--text-muted);

      font-size: 14px;

      line-height: 1.6;
    }


    .form-group {
      margin-bottom: 18px;
    }


    .form-group label {
      display: block;

      margin-bottom: 8px;

      color: #cbd5e1;

      font-size: 13px;
    }


    .form-control {
      width: 100%;

      padding: 13px 15px;

      color: var(--text-main);

      background:
        rgba(2, 6, 23, 0.6);

      border:
        1px solid
        rgba(255, 255, 255, 0.1);

      border-radius: 12px;

      outline: none;

      transition:
        border-color var(--transition),
        box-shadow var(--transition),
        transform var(--transition);
    }


    .form-control::placeholder {
      color: #64748b;
    }


    .form-control:hover,
    .form-control:focus {
      border-color:
        var(--neon-blue);

      box-shadow:
        0 0 0 3px
        rgba(34, 211, 238, 0.08),

        0 0 25px
        rgba(34, 211, 238, 0.18);

      transform: translateY(-2px);
    }


    select.form-control option {
      background: #0f172a;

      color: white;
    }


    .submit-button {
      width: 100%;

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 10px;

      padding: 14px 20px;

      margin-top: 8px;

      color: #020617;

      background:
        linear-gradient(
          135deg,
          var(--neon-green),
          var(--neon-blue)
        );

      border: none;

      border-radius: 12px;

      font-weight: 800;

      transition:
        transform var(--transition),
        box-shadow var(--transition),
        opacity var(--transition);
    }


    .submit-button:hover:not(:disabled) {
      transform: translateY(-3px);

      box-shadow:
        0 0 20px
        rgba(57, 255, 136, 0.35),

        0 0 45px
        rgba(34, 211, 238, 0.2);
    }


    .submit-button:disabled {
      cursor: not-allowed;

      opacity: 0.55;
    }


    /* ================================
       CSS:TABLE
    ================================= */

    .table-card {
      min-width: 0;

      padding: 28px;
    }


    .table-header {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;

      margin-bottom: 25px;
    }


    .member-count {
      padding: 6px 12px;

      border:
        1px solid
        rgba(57, 255, 136, 0.2);

      border-radius: 999px;

      color: var(--neon-green);

      background:
        rgba(57, 255, 136, 0.05);

      font-size: 12px;
    }


    .table-wrapper {
      width: 100%;

      overflow-x: auto;

      border-radius: 14px;
    }


    .member-table {
      width: 100%;

      min-width: 650px;

      border-collapse: collapse;
    }


    .member-table th {
      padding: 15px;

      text-align: left;

      color: #64748b;

      background:
        rgba(255, 255, 255, 0.025);

      font-size: 12px;

      letter-spacing: 1px;

      text-transform: uppercase;
    }


    .member-table td {
      padding: 17px 15px;

      border-top:
        1px solid
        rgba(255, 255, 255, 0.06);

      color: #cbd5e1;

      font-size: 14px;
    }


    .member-table tbody tr {
      transition:
        background var(--transition),
        transform var(--transition);
    }


    .member-table tbody tr:hover {
      background:
        rgba(34, 211, 238, 0.035);

      transform: translateX(3px);
    }


    /* ================================
       CSS:ROLE
    ================================= */

    .role-badge {
      display: inline-flex;

      align-items: center;

      padding: 6px 12px;

      border-radius: 999px;

      font-size: 12px;

      font-weight: 700;

      transition:
        transform var(--transition),
        box-shadow var(--transition);
    }


    .role-badge:hover {
      transform:
        translateY(-3px)
        scale(1.03);
    }


    .role-admin {
      color: #f0abfc;

      background:
        rgba(217, 70, 239, 0.08);

      border:
        1px solid
        rgba(217, 70, 239, 0.35);

      box-shadow:
        0 0 15px
        rgba(217, 70, 239, 0.2);
    }


    .role-normal {
      color: var(--neon-green);

      background:
        rgba(57, 255, 136, 0.08);

      border:
        1px solid
        rgba(57, 255, 136, 0.35);

      box-shadow:
        0 0 15px
        rgba(57, 255, 136, 0.18);
    }


    .role-unknown {
      color: var(--neon-yellow);

      background:
        rgba(250, 204, 21, 0.08);

      border:
        1px solid
        rgba(250, 204, 21, 0.3);
    }


    /* ================================
       CSS:LOADING
    ================================= */

    .loading-container {
      min-height: 260px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      gap: 18px;
    }


    .loading-spinner {
      width: 52px;

      height: 52px;

      border:
        3px solid
        rgba(255, 255, 255, 0.08);

      border-top-color:
        var(--neon-blue);

      border-right-color:
        var(--neon-green);

      border-radius: 50%;

      animation:
        spin 0.9s linear infinite;

      box-shadow:
        0 0 20px
        rgba(34, 211, 238, 0.2);
    }


    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }


    .loading-text {
      color: var(--text-muted);

      font-size: 13px;

      letter-spacing: 1px;
    }


    /* ================================
       CSS:MESSAGE
    ================================= */

    .message {
      padding: 40px 20px;

      text-align: center;

      color: var(--text-muted);
    }


    .error-message {
      color: var(--danger);
    }


    /* ================================
       CSS:TOAST
    ================================= */

    .toast {
      position: fixed;

      z-index: 999;

      right: 25px;

      bottom: 25px;

      width:
        min(380px, calc(100% - 40px));

      padding: 18px 20px;

      border:
        1px solid
        rgba(57, 255, 136, 0.3);

      border-radius: 16px;

      background:
        rgba(2, 6, 23, 0.82);

      backdrop-filter: blur(18px);

      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 0 30px
        rgba(57, 255, 136, 0.15),

        0 20px 50px
        rgba(0, 0, 0, 0.4);

      transform: translateY(30px);

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 0.3s ease,
        transform 0.3s ease;
    }


    .toast.show {
      opacity: 1;

      transform: translateY(0);
    }


    .toast-title {
      margin-bottom: 5px;

      color: var(--neon-green);

      font-weight: 800;
    }


    .toast-message {
      color: #cbd5e1;

      font-size: 14px;
    }


    /* ================================
       CSS:FOOTER
    ================================= */

    .footer {
      margin-top: 50px;

      text-align: center;

      color: #475569;

      font-size: 12px;

      letter-spacing: 1px;
    }


    /* ================================
       CSS:RWD
    ================================= */

    @media (max-width: 900px) {

      .dashboard {
        grid-template-columns: 1fr;
      }

    }


    @media (max-width: 768px) {

      .page {
        width: min(94%, 600px);

        padding: 40px 0;
      }


      .hero {
        margin-bottom: 35px;
      }


      .hero h1 {
        font-size: 42px;
      }


      .hero p {
        font-size: 15px;
      }


      .glass-card {
        border-radius: 16px;
      }


      .form-card,
      .table-card {
        padding: 20px;
      }


      .table-header {
        align-items: flex-start;

        flex-direction: column;
      }

    }


    @media (max-width: 480px) {

      .page {
        width: 92%;

        padding-top: 30px;
      }


      .hero h1 {
        font-size: 34px;
      }


      .hero-badge {
        font-size: 11px;
      }


      .toast {
        right: 20px;

        bottom: 20px;

        width:
          calc(100% - 40px);
      }

    }


    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;

        animation-duration:
          0.01ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          0.01ms !important;
      }

    }

  </style>
</head>


<body>

  <main class="page">

    <!-- =================================
         SECTION:HERO-START
    ================================== -->

    <section class="hero">

      <div class="hero-badge">
        ✦ ANTIGRAVITY SYSTEM
      </div>


      <h1>
        Member Portal
      </h1>


      <p>
        探索無重力資料中心，透過 Glassmorphism 與 Neon Glow
        打造具有未來感的會員資料管理介面。
      </p>

    </section>

    <!-- =================================
         SECTION:HERO-END
    ================================== -->


    <!-- =================================
         SECTION:DASHBOARD-START
    ================================== -->

    <section class="dashboard">

      <!-- =================================
           MEMBER FORM
      ================================== -->

      <div class="glass-card form-card floating">

        <h2 class="card-title">
          新增會員
        </h2>


        <p class="card-description">
          建立新的會員資料，資料將安全傳送至 Google Apps Script API。
        </p>


        <form
          class="member-form"
          novalidate
        >

          <div class="form-group">

            <label for="member-name">
              會員名稱
            </label>


            <input
              class="form-control"
              id="member-name"
              name="name"
              type="text"
              placeholder="請輸入會員名稱"
              autocomplete="name"
              required
            >

          </div>


          <div class="form-group">

            <label for="member-email">
              Email
            </label>


            <input
              class="form-control"
              id="member-email"
              name="email"
              type="email"
              placeholder="member@example.com"
              autocomplete="email"
              required
            >

          </div>


          <div class="form-group">

            <label for="member-role">
              角色等級
            </label>


            <select
              class="form-control"
              id="member-role"
              name="role"
              required
            >

              <option value="">
                請選擇角色
              </option>


              <option value="管理員">
                管理員
              </option>


              <option value="一般會員">
                一般會員
              </option>

            </select>

          </div>


          <button
            class="submit-button"
            type="submit"
          >

            <span class="button-text">
              ✦ 建立會員
            </span>


            <span
              class="button-loading"
              hidden
            >
              <span>◌</span>
              傳送中...
            </span>

          </button>

        </form>

      </div>


      <!-- =================================
           MEMBER TABLE
      ================================== -->

      <div class="glass-card table-card floating-slow">

        <div class="table-header">

          <div>

            <h2 class="card-title">
              會員資料庫
            </h2>


            <p class="card-description">
              即時同步 Google Sheets 會員資料
            </p>

          </div>


          <span class="member-count">

            MEMBERS:
            <span class="count-number">
              0
            </span>

          </span>

        </div>


        <div class="table-content">

          <div class="loading-container">

            <div class="loading-spinner"></div>


            <div class="loading-text">
              INITIALIZING DATABASE...
            </div>

          </div>

        </div>

      </div>

    </section>

    <!-- =================================
         SECTION:DASHBOARD-END
    ================================== -->


    <footer class="footer">
      ANTIGRAVITY MEMBER SYSTEM · FUTURE DATA EXPERIENCE
    </footer>

  </main>


  <!-- =================================
       SUCCESS TOAST
  ================================== -->

  <div
    class="toast"
    role="status"
    aria-live="polite"
  >

    <div class="toast-title">
      ✓ 操作成功
    </div>


    <div class="toast-message">
      會員資料已成功寫入資料庫。
    </div>

  </div>


  <script>

    /* ================================
       JS:CONFIG
    ================================= */

    /*
     * Google Apps Script Web App URL
     *
     * 這裡直接放「部署完成後」的 /exec URL。
     */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbzrvwMTxjSTGsnW2z-6e-M-_NuDWwOLhehYNgI2PFH3-4DDPxrPayAjfjPzB1kePKt1RQ/exec";


    /* ================================
       JS:DOM
    ================================= */

    const memberForm =
      document.querySelector(".member-form");


    const tableContent =
      document.querySelector(".table-content");


    const countNumber =
      document.querySelector(".count-number");


    const submitButton =
      document.querySelector(".submit-button");


    const buttonText =
      document.querySelector(".button-text");


    const buttonLoading =
      document.querySelector(".button-loading");


    const toast =
      document.querySelector(".toast");


    const toastMessage =
      document.querySelector(".toast-message");


    /* ================================
       JS:API VALIDATION
    ================================= */

    function validateAPIUrl() {

      if (!API_URL) {
        throw new Error(
          "尚未設定 API_URL，請先填入 Google Apps Script Web App URL。"
        );
      }


      if (!API_URL.startsWith(
        "https://script.google.com/macros/s/"
      )) {
        throw new Error(
          "API_URL 格式不正確，請確認 Google Apps Script Web App URL。"
        );
      }


      if (!API_URL.endsWith("/exec")) {
        throw new Error(
          "API_URL 必須使用 Google Apps Script Web App 的 /exec 網址。"
        );
      }

    }


    /* ================================
       JS:UTILITY
    ================================= */

    function showToast(message) {

      toastMessage.textContent =
        message;


      toast.classList.add("show");


      window.setTimeout(() => {

        toast.classList.remove("show");

      }, 3500);

    }


    function showError(message) {

      tableContent.innerHTML = `
        <div class="message error-message">
          ⚠ ${escapeHTML(message)}
        </div>
      `;


      countNumber.textContent = "0";

    }


    function escapeHTML(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    function getRoleClass(role) {

      const roleMap = {

        "管理員":
          "role-admin",

        "一般會員":
          "role-normal"

      };


      return (
        roleMap[role] ||
        "role-unknown"
      );

    }


    /* ================================
       JS:LOADING
    ================================= */

    function showTableLoading() {

      tableContent.innerHTML = `
        <div class="loading-container">

          <div class="loading-spinner"></div>

          <div class="loading-text">
            SYNCHRONIZING DATA...
          </div>

        </div>
      `;

    }


    /* ================================
       JS:GET
    ================================= */

    async function fetchMembers() {

      showTableLoading();


      try {

        /*
         * 檢查 API_URL
         *
         * 修正重點：
         * 不再把目前使用中的 API URL
         * 當成「未設定」。
         */

        validateAPIUrl();


        const response =
          await fetch(
            `${API_URL}?action=read`,
            {
              method: "GET",

              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            `API 回應錯誤：HTTP ${response.status}`
          );

        }


        const result =
          await response.json();


        if (
          !result ||
          result.status !== "success"
        ) {

          throw new Error(
            result?.message ||
            "取得會員資料失敗。"
          );

        }


        const members =
          Array.isArray(result.data)
            ? result.data
            : [];


        renderMembers(members);

      }


      catch (error) {

        console.error(
          "fetchMembers Error:",
          error
        );


        showError(
          error.message ||
          "讀取會員資料時發生錯誤。"
        );

      }

    }


    /* ================================
       JS:RENDER
    ================================= */

    function renderMembers(members) {

      countNumber.textContent =
        members.length;


      if (members.length === 0) {

        tableContent.innerHTML = `
          <div class="message">
            ✦ 目前尚無會員資料
          </div>
        `;

        return;

      }


      const rows =
        members
          .map((member) => {

            const name =
              member.name ??
              member.姓名 ??
              "";


            const email =
              member.email ??
              member.Email ??
              "";


            const role =
              member.role ??
              member.角色 ??
              member.等級 ??
              "一般會員";


            return `
              <tr>

                <td>
                  ${escapeHTML(name)}
                </td>


                <td>
                  ${escapeHTML(email)}
                </td>


                <td>

                  <span
                    class="role-badge ${getRoleClass(role)}"
                  >
                    ${escapeHTML(role)}
                  </span>

                </td>

              </tr>
            `;

          })
          .join("");


      tableContent.innerHTML = `

        <div class="table-wrapper">

          <table class="member-table">

            <thead>

              <tr>

                <th>
                  Member
                </th>

                <th>
                  Email
                </th>

                <th>
                  Role
                </th>

              </tr>

            </thead>


            <tbody>
              ${rows}
            </tbody>

          </table>

        </div>

      `;

    }


    /* ================================
       JS:POST
    ================================= */

    memberForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        if (!memberForm.checkValidity()) {

          memberForm.reportValidity();

          return;

        }


        setSubmitLoading(true);


        try {

          /*
           * 檢查 API URL
           */

          validateAPIUrl();


          const formData =
            new FormData(memberForm);


          const payload = {

            name:
              String(
                formData.get("name") || ""
              ).trim(),


            email:
              String(
                formData.get("email") || ""
              ).trim(),


            role:
              String(
                formData.get("role") || ""
              ).trim()

          };


          if (
            !payload.name ||
            !payload.email ||
            !payload.role
          ) {

            throw new Error(
              "請完整填寫會員資料。"
            );

          }


          /*
           * 使用 text/plain
           *
           * 這對 GAS Web API 很重要，
           * 可避免 application/json 所產生的
           * CORS preflight 問題。
           */

          const response =
            await fetch(
              API_URL,
              {

                method: "POST",

                headers: {
                  "Content-Type":
                    "text/plain;charset=utf-8"
                },

                body:
                  JSON.stringify(payload)

              }
            );


          if (!response.ok) {

            throw new Error(
              `API 回應錯誤：HTTP ${response.status}`
            );

          }


          const result =
            await response.json();


          if (
            !result ||
            result.status !== "success"
          ) {

            throw new Error(
              result?.message ||
              "會員資料寫入失敗。"
            );

          }


          /*
           * 成功
           */

          memberForm.reset();


          showToast(
            "會員資料已成功寫入資料庫！"
          );


          /*
           * POST 成功後重新取得會員資料
           */

          await fetchMembers();

        }


        catch (error) {

          console.error(
            "POST Error:",
            error
          );


          showToast(
            `⚠ ${
              error.message ||
              "寫入資料失敗"
            }`
          );

        }


        finally {

          setSubmitLoading(false);

        }

      }
    );


    /* ================================
       JS:BUTTON STATE
    ================================= */

    function setSubmitLoading(isLoading) {

      submitButton.disabled =
        isLoading;


      buttonText.hidden =
        isLoading;


      buttonLoading.hidden =
        !isLoading;

    }


    /* ================================
       JS:INITIALIZE
    ================================= */

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        fetchMembers();

      }
    );

  </script>

</body>

</html>
